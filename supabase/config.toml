# Parc Pilot — configuration des Edge Functions (lue par le CLI Supabase au déploiement).
#
# km-collect est une fonction PUBLIQUE (le chauffeur n'a pas de compte Parc Pilot) : elle
# est protégée par un TOKEN secret dans le lien, pas par un JWT. On désactive donc la
# vérification du JWT pour cette fonction UNIQUEMENT. Les autres fonctions (send-email,
# manage-users, scan-doc) gardent le comportement par défaut (JWT requis + contrôle interne).
project_id = "tzjuptlzoywjeigmyfuj"

[functions.km-collect]
verify_jwt = false

# edl-sign : page de signature d'état des lieux PUBLIQUE (l'employé n'a pas de compte).
# Protégée par un TOKEN secret dans le lien (comme km-collect). JWT désactivé.
[functions.edl-sign]
verify_jwt = false

# offre-achat : formulaire ACHETEUR PUBLIC (l'acheteur d'un véhicule n'a pas de compte Parc Pilot).
# Protégée par un TOKEN secret dans le lien (comme km-collect / edl-sign). JWT désactivé.
[functions.offre-achat]
verify_jwt = false

# reservation : demande de RÉSERVATION de véhicule PUBLIQUE (le collègue n'a pas de compte Parc Pilot).
# Protégée par un TOKEN société secret dans le lien (comme offre-achat) + disponibilité vérifiée serveur.
[functions.reservation]
verify_jwt = false

# km-relance : relance AUTOMATIQUE des relevés km, appelée par une tâche planifiée
# (pg_cron) qui n'a pas de JWT utilisateur. Protégée par l'en-tête x-cron-secret
# (== KM_RELANCE_SECRET) OU un JWT de CEO pour un test manuel — contrôle fait DANS la
# fonction. On désactive donc la vérification du JWT par la plateforme.
[functions.km-relance]
verify_jwt = false

# ulys-daily : import AUTOMATIQUE quotidien des factures Ulys + alerte e-mail, appelée par
# une tâche planifiée (pg_cron) sans JWT utilisateur. Même modèle que km-relance : protégée
# par l'en-tête x-cron-secret (== ULYS_DAILY_SECRET ou KM_RELANCE_SECRET) OU un JWT de CEO
# pour un test manuel. Le GET public (contrôle de config) ne renvoie que des booléens.
[functions.ulys-daily]
verify_jwt = false

# task-reminders : rappels PUSH des TÂCHES (résumé du jour + rappel « quelques heures avant » un
# rdv), appelée toutes les 30 min par une tâche planifiée (pg_cron) sans JWT utilisateur. Même
# modèle que km-relance : protégée par l'en-tête x-cron-secret (== TASK_REMINDERS_SECRET ou
# KM_RELANCE_SECRET réutilisé) OU un JWT de CEO pour un test manuel. JWT plateforme désactivé.
[functions.task-reminders]
verify_jwt = false

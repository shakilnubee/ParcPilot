<style>
  body{background:#F4F6FA;color:#1e293b}
  .ln-wrap{max-width:920px;margin:0 auto;padding:1.4rem 1.2rem 3rem}
  .ln-head{background:linear-gradient(135deg,#0B1220,#1E293B);color:#fff;border-radius:1rem;padding:1.4rem 1.6rem;margin-bottom:1.1rem}

<body><script>try{if(localStorage.getItem("fp_dark_mode")!=="0")document.body.classList.add("fp-dark")}catch(e){}</script>
<div class="ln-wrap">
  <a href="dashboard.html" class="ln-back"><i data-lucide="arrow-left" class="w-4 h-4 inline"></i> Tableau de bord</a>
  <div class="ln-head">
    <svg width="150" height="30" viewBox="0 0 154 36" xmlns="http://www.w3.org/2000/svg" style="overflow:visible"><line x1="2" y1="10" x2="24" y2="10" stroke="#FB923C" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="18" x2="28" y2="18" stroke="#F97316" stroke-width="3" stroke-linecap="round"/><line x1="6" y1="26" x2="22" y2="26" stroke="#FB923C" stroke-width="3" stroke-linecap="round"/><text x="34" y="26" font-size="20" font-weight="900" font-style="italic"><tspan fill="#ffffff">Parc</tspan><tspan fill="#F97316">Pilot</tspan></text></svg>
    <h1>🔗 Tous les liens</h1>
    <p>Tous les liens utiles au même endroit : à partager avec un client/prospect, les pages publiques (QR, amendes), les outils internes et l'aide. Bouton <b>Copier</b> pour coller le lien où tu veux.</p>
  </div>
  <div id="ln-list"></div>
</div>
<div id="ln-toast" class="ln-toast"></div>
<script>
  var BASE = 'https://parc-pilot.fr/';
  // Chaque entrée : { t: titre, d: description, path: chemin (relatif au domaine), icon, pdf?: lien PDF direct }
  var GROUPS = [
    { g: 'À partager avec un client / prospect', items: [
      { t: 'Plateforme (connexion)', d: 'Le point d\'entrée de Parc Pilot : la page où ton client se connecte.', path: '', icon: 'log-in' },
      { t: 'Brochure', d: 'Présentation commerciale soignée (avec bouton « Télécharger en PDF »).', path: 'brochure.html', icon: 'sparkles', pdf: 'presentation/Parc-Pilot-Brochure.pdf' },
      { t: 'Tarifs', d: 'La grille tarifaire à montrer au client.', path: 'prix.html', icon: 'badge-euro' },
      { t: 'Carte de visite', d: 'Ta carte de visite digitale (contact + QR), à envoyer ou afficher.', path: 'carte-visite.html', icon: 'contact' },
      { t: 'Démo', d: 'Démonstration auto-jouée de la plateforme (idéale en rendez-vous).', path: 'demo.html', icon: 'presentation' },
    ]},
  ];
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function toast(m){ var t=document.getElementById('ln-toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('on');},1600); }
  function copy(txt){
    try { if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){toast('✓ Lien copié');},function(){fallback(txt);}); } else fallback(txt); }
    catch(e){ fallback(txt); }
  }
  function fallback(txt){ try{ var i=document.createElement('textarea'); i.value=txt; document.body.appendChild(i); i.select(); document.execCommand('copy'); i.remove(); toast('✓ Lien copié'); }catch(e){ toast('Copie impossible'); } }
  var html='';
  GROUPS.forEach(function(grp){
    html += '<div class="ln-grp">'+esc(grp.g)+'</div>';
    grp.items.forEach(function(it){
      var url = BASE + it.path;
      html += '<div class="ln-card">'
        + '<div class="ln-ico"><i data-lucide="'+esc(it.icon)+'"></i></div>'
        + '<div class="ln-body">'
        +   '<div class="ln-t">'+esc(it.t)+'</div>'
        +   '<div class="ln-d">'+esc(it.d)+'</div>'
        +   '<code class="ln-url">'+esc(url)+'</code>'
        +   '<div class="ln-actions">'
        +     '<button class="btn2 primary" data-copy="'+esc(url)+'"><i data-lucide="copy"></i> Copier le lien</button>'
        +     '<a class="btn2" href="'+esc(url)+'" target="_blank" rel="noopener"><i data-lucide="external-link"></i> Ouvrir</a>'
        +     (it.pdf ? '<a class="btn2" href="'+esc(it.pdf)+'" target="_blank" rel="noopener" download><i data-lucide="download"></i> PDF</a>' : '')
        +   '</div>'
        + '</div></div>';
    });
  });
  document.getElementById('ln-list').innerHTML = html;
  document.addEventListener('click', function(e){ var b=e.target.closest && e.target.closest('[data-copy]'); if(b){ e.preventDefault(); copy(b.getAttribute('data-copy')); } });
  if(window.lucide&&lucide.createIcons){ try{ lucide.createIcons(); }catch(e){} }
</script>

<style>

  .ec-btn { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.1); color:#fff; padding:9px 15px; border-radius:12px; cursor:pointer; font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:6px; text-decoration:none; backdrop-filter:blur(6px); transition:background .2s; }

  @keyframes ecIn{ to{ opacity:1; transform:none } }
  .ec-tile::after{ content:""; position:absolute; width:340px; height:340px; right:-130px; top:-150px; border-radius:50%;

    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;

    animation:ecBorder 7s linear infinite; opacity:.75; pointer-events:none; }
  @keyframes ecBorder{ 0%{background-position:0% 50%} 100%{background-position:220% 50%} }
  .ec-label { font-size:clamp(12px,1vw,15px); text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:800; position:relative; z-index:1; }

  @keyframes ecDraw{ to{ stroke-dashoffset:0 } }

  .ec-ticker { flex:none; margin:0 34px 20px; background:linear-gradient(90deg, rgba(249,115,22,.1), rgba(255,255,255,.04)); border:1px solid rgba(255,255,255,.07); border-radius:16px; padding:14px 22px; display:flex; align-items:center; gap:16px; overflow:hidden; }
  .ec-ticker > i{ flex:none; }

  .ec-marq{ display:inline-flex; align-items:center; gap:46px; white-space:nowrap; will-change:transform; animation:ecMarq 50s linear infinite; }

  @keyframes ecMarq{ from{transform:translateX(0)} to{transform:translateX(-50%)} }
  .ec-dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; box-shadow:0 0 10px currentColor; }

  .ec-fx { position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }

  .ec-fx .au { position:absolute; border-radius:50%; filter:blur(120px); }
  .ec-fx .au1 { width:640px; height:640px; background:radial-gradient(circle,#F97316,transparent 70%); top:-220px; right:-160px; opacity:.3; animation:ecA 18s ease-in-out infinite; }
  .ec-fx .au2 { width:580px; height:580px; background:radial-gradient(circle,#38BDF8,transparent 70%); bottom:-240px; left:-180px; opacity:.28; animation:ecB 22s ease-in-out infinite; }
  .ec-fx .au3 { width:520px; height:520px; background:radial-gradient(circle,#a855f7,transparent 70%); top:28%; left:42%; opacity:.16; animation:ecA 27s ease-in-out infinite reverse; }
  @keyframes ecA { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-40px,30px) scale(1.1)} }
  @keyframes ecB { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(50px,-30px) scale(1.08)} }
  @media (prefers-reduced-motion:reduce){ .ec-fx .au,.ec-tile,.ec-tile.hero::before,.ec-pulse,.ec-spark-line,.ec-marq,.ec-live b{ animation:none !important } .ec-tile{ opacity:1; transform:none } .ec-spark-line{ stroke-dashoffset:0 } }

  /* ===== MOBILE (téléphone) : bento figé → on empile, page scrollable, valeurs plus petites. ===== */

    body{ display:block; height:auto; overflow:auto; -webkit-overflow-scrolling:touch; }
    .ec-top{ flex-wrap:wrap; row-gap:10px; padding:14px 16px; }
    .ec-top > div{ flex-wrap:wrap; gap:10px !important; min-width:0; }
    .ec-top svg{ width:118px; height:27px; }
    #ec-soc{ font-size:1rem !important; }
    #ec-clock{ white-space:nowrap; font-size:15px; }
    .ec-btn{ font-size:13px; padding:7px 11px; }
    .ec-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-rows:auto; grid-template-areas:none; gap:12px; padding:8px 16px 14px; }
    .ec-tile{ grid-area:auto !important; padding:15px 16px; border-radius:16px; }
    .ec-tile.hero{ grid-column:span 2; }
    .ec-label{ letter-spacing:.04em; }
    .ec-value{ font-size:clamp(1.4rem,6.5vw,2rem); margin-top:6px; overflow-wrap:anywhere; }
    .ec-tile.hero .ec-value{ font-size:clamp(1.7rem,9vw,2.5rem); }
    .ec-sub{ margin-top:5px; }
    .ec-ic{ top:12px; right:12px; }
    .ec-ic svg{ width:32px; height:32px; }
    .ec-tile.hero .ec-ic svg{ width:40px; height:40px; }
    .ec-pulse{ width:150px; height:150px; }
    .ec-ticker{ margin:6px 16px 18px; padding:12px 16px; }
    .ec-marq .it{ font-size:14px; }
  }

<script>/* ⚡ PERF : data.js (~301 Ko) n'est chargé QU'EN DÉMARRAGE À FROID. Dès qu'un cache
   localStorage par société est COMPLET (2e visite+), on peuple FP_DATA depuis lui et on NE CHARGE PAS
   data.js → plus de parse inutile à chaque navigation. Cache incomplet/absent (1re visite, quota,
   incident) → on charge data.js (filet), et app.js fusionne par clé. Cf. app.js §seedFromCache. */
(function(){
  try {
    var soc = localStorage.getItem('fp_societe') || 'PXP';
    var c = JSON.parse(localStorage.getItem('fp_data_cache_v4_' + soc) || 'null');
    var full = c && ['vehicules','amendes','factures','conducteurs'].every(function(k){ return Array.isArray(c[k]) && c[k].length; });
    if (full) {
      window.FP_DATA = { vehicules: c.vehicules, amendes: c.amendes, factures: c.factures, conducteurs: c.conducteurs };
      window.__fpSeeded = 1; // dit à app.js §seedFromCache que FP_DATA est déjà peuplé (pas de re-parse)
      return; // data.js NON chargé
    }
  } catch (e) {}
  document.write('<scr' + 'ipt src="../assets/js/data.js?v=20261030w"><\/scr' + 'ipt>'); // cold start : filet data.js (ordre/synchro préservés)
})();
</script>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let soc = 'PXP'; try { soc = localStorage.getItem('fp_societe') || 'PXP'; if (soc === '__all__') soc = 'Toutes sociétés'; } catch (e) {}
  $('ec-soc').textContent = soc;

  function metrics() {
    const D = window.FP_DATA || {};
    const now = new Date();
    // Mois courant via le helper canonique (date LOCALE) — même mois que le dashboard/stats. toISOString()
    // est en UTC → autour du changement de mois (nuit, Paris en avance sur UTC) le mois pouvait différer.
    const ym = (window.FP && FP.ymLocal) ? FP.ymLocal(now) : now.toISOString().slice(0, 7);
    const y12 = (window.FP && FP.ymLocal) ? FP.ymLocal(new Date(now.getFullYear(), now.getMonth() - 11, 1)) : new Date(now.getFullYear(), now.getMonth() - 11, 1).toISOString().slice(0, 7);
    const actifs = (D.vehicules || []).filter(v => !(window.FP && FP.estVendu ? FP.estVendu(v) : /vendu/i.test(v.statut || ''))); // parc possédé (hors vendus)
    const km = actifs.reduce((s, v) => s + (FP.kmActuel ? FP.kmActuel(v) : (Number(v.km) || 0)), 0); // km réel — même source que le dashboard/stats
    const facts = D.factures || [];
    // Coût du mois = coût d'EXPLOITATION (helper canonique) — même chiffre que le dashboard.
    const coutMois = FP.coutMois ? FP.coutMois(D, ym) : facts.filter(f => (f.date || '').slice(0, 7) === ym).reduce((s, f) => s + (+f.montantTTC || 0), 0);
    // Coûts 12 mois = somme du coût d'exploitation mensuel (même périmètre que la tuile « Coût du mois » :
    // dédoublonné + exploit). Éviter la somme brute qui incluait achat/leasing/doublons.
    const cout12 = FP.coutMois
      ? (function () { let t = 0; const base = new Date(ym + '-01'); for (let i = 0; i < 12; i++) { const m = new Date(base.getFullYear(), base.getMonth() - i, 1); const s = m.getFullYear() + '-' + String(m.getMonth() + 1).padStart(2, '0'); t += FP.coutMois(D, s); } return t; })()
      : facts.filter(f => (f.date || '').slice(0, 7) >= y12).reduce((s, f) => s + (+f.montantTTC || 0), 0);
    // Série des 12 derniers mois (coût d'exploitation) pour la sparkline de la tuile « Coûts 12 mois ».
    const serie = [];
    if (FP.coutMois) { const base = new Date(ym + '-01'); for (let i = 11; i >= 0; i--) { const mo = new Date(base.getFullYear(), base.getMonth() - i, 1); const s = mo.getFullYear() + '-' + String(mo.getMonth() + 1).padStart(2, '0'); serie.push(FP.coutMois(D, s)); } }
    const alerts = FP.buildAlertes ? FP.buildAlertes(D) : [];
    const critiques = alerts.filter(a => a.niveau === 'danger' || a.niveau === 'warn').length;
    const ech = (FP.buildEcheances ? FP.buildEcheances(D) : []).filter(e => { const j = FP.joursRestants ? FP.joursRestants(e.date) : Math.ceil((new Date(e.date) - now) / 86400000); return j != null && j <= 90; }); // source unique (minuit→minuit)
    const tvs = FP.tvsAnnuelleFlotte ? FP.tvsAnnuelleFlotte(D.vehicules) : actifs.reduce((s, v) => { const d = FP.tvsDetail ? FP.tvsDetail(v) : null; return s + (d && d.applicable && d.total != null ? d.total : 0); }, 0);
    // Amendes « à payer » (actionnable) — source unique FP.estAPayer + montant dû FP.montantDu (majoré si dépassé).
    const amAPayerList = (D.amendes || []).filter(a => FP.estAPayer ? FP.estAPayer(a) : /a *payer/i.test(((a && a.statut) || '').toLowerCase()));
    const amAPayer = amAPayerList.length;
    const amDu = amAPayerList.reduce((s, a) => s + (FP.montantDu ? FP.montantDu(a) : (Number(a.montant) || 0)), 0);
    // Véhicules disponibles (sans conducteur affecté) — utile pour réaffecter d'un coup d'œil.
    const dispo = actifs.filter(v => { const c = (v.chauffeur || '').toString().trim(); return !c || c === '—'; }).length;
    return { nb: actifs.length, km, coutMois, cout12, critiques, ech, tvs, amAPayer, amDu, dispo, serie };
  }
  const eur = n => FP.euro ? FP.euro(n) : Math.round(n) + ' €';
  const num = n => FP.num ? FP.num(n) : String(n);

  // Compteur animé (valeur précédente → nouvelle) avec easing — l'écran « prend vie » à chaque rendu.
  function countUp(el, to, fmt) {
    const from = Number(el.getAttribute('data-v') || 0);
    if (!(to >= 0)) to = 0;
    const t0 = performance.now(), dur = 1100;
    (function step(t) {
      let p = Math.min(1, (t - t0) / dur); p = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(from + (to - from) * p);
      if (p < 1) requestAnimationFrame(step); else { el.textContent = fmt(to); el.setAttribute('data-v', to); }
    })(performance.now());
  }
  // Mini-courbe (sparkline) animée des 12 derniers mois.
  function spark(serie, color) {
    if (!serie || serie.length < 2) return '';
    const W = 100, H = 32, max = Math.max.apply(null, serie), min = Math.min.apply(null, serie), rng = (max - min) || 1;
    const pts = serie.map((v, i) => [i / (serie.length - 1) * W, H - ((v - min) / rng) * (H - 4) - 2]);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const gid = 'sg' + Math.random().toString(36).slice(2, 7);
    return `<svg class="ec-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".4"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      <path d="${line} L ${W} ${H} L 0 ${H} Z" fill="url(#${gid})"/>
      <path class="ec-spark-line" d="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }
  const col = { danger: '#F87171', warn: '#fbbf24', info: '#38bdf8' };

  function render() {
    const m = metrics();
    const fN = v => num(Math.round(v)), fE = v => eur(Math.round(v));
    // Bento : 2 tuiles HÉRO (Alertes = pouls de la flotte à gauche ; Coûts 12 mois + courbe à droite),
    // bloc central 2×2 (Parc, Échéances, Coût du mois, Amendes). Valeurs en compteur animé.
    const tiles = [
      { area: 'al', label: 'Alertes actives', n: m.critiques, fmt: fN, sub: m.critiques ? 'à traiter maintenant' : 'tout est calme ✓', ic: 'siren', color: m.critiques ? '#F87171' : '#34d399', hero: true, pulse: m.critiques > 0 },
      { area: 'pa', label: 'Parc actif', n: m.nb, fmt: fN, sub: m.dispo ? (m.dispo + ' sans conducteur') : 'véhicules en service', ic: 'car', color: '#38bdf8' },
      { area: 'ec', label: 'Échéances 90 j', n: m.ech.length, fmt: fN, sub: 'CT, assurance, leasing…', ic: 'calendar-clock', color: m.ech.length ? '#fbbf24' : '#34d399' },
      { area: 'cm', label: "Coût d'exploitation du mois", n: m.coutMois, fmt: fE, sub: 'entretien, réparations…', ic: 'wallet', color: '#F97316' },
      { area: 'am', label: 'Amendes à payer', n: m.amAPayer, fmt: fN, sub: m.amAPayer ? (eur(m.amDu) + ' à régler') : 'tout est réglé ✓', ic: 'file-warning', color: m.amAPayer ? '#F87171' : '#34d399' },
      { area: 'c12', label: 'Coûts 12 mois', n: m.cout12, fmt: fE, sub: 'glissants', ic: 'trending-up', color: '#f472b6', hero: true, spark: m.serie },
    ];
    $('ec-grid').innerHTML = tiles.map((t, i) => `<div class="ec-tile${t.hero ? ' hero' : ''}${t.spark ? ' has-spark' : ''}" style="grid-area:${t.area};--glow:${t.color};animation-delay:${i * 80}ms">
      ${t.pulse ? '<div class="ec-pulse"></div>' : ''}${t.spark ? spark(t.spark, t.color) : ''}
      <div class="ec-ic"><i data-lucide="${t.ic}"></i></div>
      <div class="ec-label">${t.label}</div>
      <div class="ec-value" data-v="0" style="color:${t.color}">${t.fmt(0)}</div>
      <div class="ec-sub">${t.sub}</div>
    </div>`).join('');
    $('ec-grid').querySelectorAll('.ec-value').forEach((el, i) => countUp(el, tiles[i].n, tiles[i].fmt));
    // Bandeau défilant continu (échéances proches, en boucle sans couture = contenu dupliqué).
    const items = m.ech.slice(0, 16).map(e => `<span class="it"><span class="ec-dot" style="color:${col[e.niveau] || '#8aa0c4'};background:${col[e.niveau] || '#8aa0c4'}"></span>${esc(e.label)} — ${FP.dateNum ? FP.dateNum(e.date) : e.date}</span>`).join('');
    const inner = items || `<span class="it" style="color:#34d399"><span class="ec-dot" style="color:#34d399;background:#34d399"></span>Aucune échéance sous 90 jours — tout est à jour ✓</span>`;
    $('ec-ticker-txt').innerHTML = `<div class="ec-marq">${inner}${inner}</div>`;
    if (window.lucide && lucide.createIcons) lucide.createIcons();
  }

  function clock() { const d = new Date(); $('ec-clock').textContent = d.toLocaleDateString('fr-FR', { weekday: 'short', day: '2-digit', month: 'short' }) + ' · ' + d.toTimeString().slice(0, 5); }

  $('ec-full').addEventListener('click', () => { if (!document.fullscreenElement) { (document.documentElement.requestFullscreen && document.documentElement.requestFullscreen()); } else { document.exitFullscreen && document.exitFullscreen(); } });

  render();
  clock();
  document.addEventListener('fp:data-ready', render);
  setInterval(clock, 30000);                                // horloge
  setInterval(() => { if (window.FP && FP.db && FP.supabase) FP.db.loadAll().then(d => { Object.assign(window.FP_DATA, d); render(); }).catch(() => {}); }, 300000); // rafraîchit les données (5 min)
</script>
<script>
/* Ambiance particules (constellation) derrière l'affichage TV */
(function(){
  var c=document.getElementById('ecfx'); if(!c) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ctx=c.getContext('2d'),W,H,pts=[],DPR=Math.min(2,devicePixelRatio||1);
  function size(){W=c.width=innerWidth*DPR;H=c.height=innerHeight*DPR;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';}
  size(); addEventListener('resize',size);
  var N=Math.round(Math.min(72,innerWidth/22));
  for(var i=0;i<N;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.2*DPR,vy:(-.1-Math.random()*.28)*DPR,r:(Math.random()*1.7+.8)*DPR,o:Math.random()*.4+.32});
  var L2=(122*DPR)*(122*DPR);
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<pts.length;i++){for(var j=i+1;j<pts.length;j++){var a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;if(d<L2){ctx.strokeStyle='rgba(148,175,214,'+((1-d/L2)*.20)+')';ctx.lineWidth=DPR;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}}
    for(var i=0;i<pts.length;i++){var p=pts[i];p.x+=p.vx;p.y+=p.vy;if(p.y<-10){p.y=H+10;p.x=Math.random()*W}if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;var col=(i%3===0?'56,189,248':'251,146,60');ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.shadowColor='rgba('+col+',.8)';ctx.shadowBlur=6*DPR;ctx.fillStyle='rgba('+col+','+p.o+')';ctx.fill();}
    ctx.shadowBlur=0; requestAnimationFrame(tick);
  }
  tick();
})();
</script>

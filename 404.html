<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>/* pp-build */(function(){try{var B="20261026i",K="pp_build",cur=null;try{cur=localStorage.getItem(K);}catch(e){return;}if(cur===B)return;var ok=false;try{localStorage.setItem(K,B);ok=true;}catch(e){}if(!ok)return;if("serviceWorker"in navigator){try{navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){try{r.update();}catch(e){}});}).catch(function(){});}catch(e){}}if(cur===null)return;var done=function(){try{location.reload();}catch(e){}};if(window.caches&&caches.keys){caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}).then(done).catch(done);}else{done();}}catch(e){}})();</script>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<title>Page introuvable — Parc Pilot</title>
<meta name="robots" content="noindex">
<style>
  :root{ --void:#05070D; --orange:#F97316; --amber:#FB923C; --cyan:#38BDF8; --ink:#EAF1FB; --muted:#8AA0C0; }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{
    color:var(--ink); font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
    display:flex; align-items:center; justify-content:center; padding:1.5rem;
    background:
      radial-gradient(1100px 700px at 82% -10%, rgba(249,115,22,.20), transparent 55%),
      radial-gradient(900px 700px at 8% 108%, rgba(56,189,248,.16), transparent 55%),
      radial-gradient(1400px 900px at 50% 40%, #0B1426 0%, var(--void) 70%);
  }
  .aurora{position:fixed;border-radius:50%;filter:blur(90px);opacity:.4;pointer-events:none}
  .a1{width:520px;height:520px;background:radial-gradient(circle,var(--orange),transparent 70%);top:-160px;right:-140px;animation:fl 15s ease-in-out infinite}
  .a2{width:460px;height:460px;background:radial-gradient(circle,var(--cyan),transparent 70%);bottom:-180px;left:-140px;animation:fl 19s ease-in-out infinite reverse}
  @keyframes fl{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,30px) scale(1.12)}}
  .card{position:relative;z-index:2;text-align:center;max-width:460px;padding:2.6rem 2rem;
    background:linear-gradient(180deg, rgba(18,28,48,.72), rgba(9,14,26,.78));
    border:1px solid rgba(249,115,22,.28); border-radius:24px;
    box-shadow:0 50px 100px -35px rgba(0,0,0,.9), 0 0 70px -26px rgba(249,115,22,.45);
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
    animation:in .7s cubic-bezier(.16,1,.3,1) both}
  @keyframes in{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
  .logo{display:flex;justify-content:center;margin-bottom:1.4rem;filter:drop-shadow(0 6px 20px rgba(249,115,22,.4))}
  .big{font-family:'Space Grotesk','Inter',sans-serif;font-weight:800;font-size:5rem;line-height:1;
    background:linear-gradient(135deg,var(--amber),var(--orange));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:.2rem 0}
  h1{font-size:1.3rem;font-weight:800;margin:.4rem 0 .3rem;color:#fff}
  p{color:var(--muted);font-size:.95rem;line-height:1.55;margin:0 auto 1.6rem;max-width:340px}
  .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.3rem;border-radius:.7rem;text-decoration:none;
    font-weight:700;font-size:.95rem;color:#150a02;background:linear-gradient(135deg,var(--amber),var(--orange));
    box-shadow:0 12px 30px -10px rgba(249,115,22,.7);transition:transform .15s,filter .2s}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
  @media (prefers-reduced-motion:reduce){.aurora,.card{animation:none}}
</style>
</head>
<body>
  <div class="aurora a1"></div><div class="aurora a2"></div>
  <div class="card">
    <div class="logo">
      <svg width="160" viewBox="0 0 154 36" xmlns="http://www.w3.org/2000/svg" aria-label="Parc Pilot" style="overflow:visible"><line x1="2" y1="10" x2="24" y2="10" stroke="#FB923C" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="18" x2="28" y2="18" stroke="#F97316" stroke-width="3" stroke-linecap="round"/><line x1="6" y1="26" x2="22" y2="26" stroke="#FB923C" stroke-width="3" stroke-linecap="round"/><text x="34" y="26" font-size="20" font-weight="900" font-style="italic"><tspan fill="#EAF1FB">Parc</tspan><tspan fill="#F97316">Pilot</tspan></text></svg>
    </div>
    <div class="big">404</div>
    <h1>Cette page a quitté le parc</h1>
    <p>La page que tu cherches n'existe pas ou a été déplacée. Reprends les commandes depuis le poste de pilotage.</p>
    <a class="btn" href="/">← Retour à l'accueil</a>
  </div>
</body>
</html>

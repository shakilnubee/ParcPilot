name: Migration — appliquer sur le STAGING

# Applique UN fichier de supabase/migrations/ sur le projet STAGING (données fictives),
# pour tester une migration avant la production. Lancement à la main uniquement :
# Actions → « Migration — appliquer sur le STAGING » → Run workflow → nom du fichier.
# ⛔ Ne vise JAMAIS la production : seul le secret STAGING_DB_URL est utilisé, et le
# job s'arrête si l'adresse ne désigne pas le projet staging.
on:
  workflow_dispatch:
    inputs:
      fichier:
        description: 'Nom du fichier dans supabase/migrations/ (ex. 20261020100000_conges_fonctions_table_source.sql)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: migration-staging
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_URL: ${{ secrets.STAGING_DB_URL }}
      FICHIER: ${{ inputs.fichier }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifications
        run: |
          if [ -z "$DB_URL" ]; then echo "::error::Secret STAGING_DB_URL absent."; exit 1; fi
          if ! echo "$DB_URL" | grep -q "csvjmzwexszsbowibxut"; then
            echo "::error::STAGING_DB_URL ne désigne pas le projet staging (csvjmzwexszsbowibxut). Arrêt."; exit 1
          fi
          if echo "$DB_URL" | grep -q "tzjuptlzoywjeigmyfuj"; then echo "::error::Adresse de PRODUCTION refusée."; exit 1; fi
          case "$FICHIER" in */*|*..*|"") echo "::error::Nom de fichier invalide : $FICHIER"; exit 1;; esac
          test -f "supabase/migrations/$FICHIER" || { echo "::error::Fichier introuvable : supabase/migrations/$FICHIER"; exit 1; }
      - name: Installer psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client > /dev/null
          psql --version
      - name: Appliquer la migration sur le staging
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -X -f "supabase/migrations/$FICHIER"

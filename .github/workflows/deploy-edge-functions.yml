# Déploiement AUTOMATIQUE des Edge Functions Supabase (scan-doc, manage-users, send-email).
# Se déclenche à chaque push sur `main` qui touche supabase/functions/** — comme GitHub Pages
# pour le site, mais pour les fonctions serveur. Plus besoin de copier-coller dans le dashboard.
#
# ⚠️ PRÉREQUIS (une seule fois) : ajouter le secret SUPABASE_ACCESS_TOKEN dans
#   GitHub → Settings → Secrets and variables → Actions → New repository secret.
#   Le token se génère sur https://supabase.com/dashboard/account/tokens
#   (SUPABASE_URL / SERVICE_ROLE / ANON restent injectés automatiquement côté Supabase).
name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch: {}   # bouton « Run workflow » pour redéployer à la demande

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Ne tourne que si le token est présent → tant qu'il n'est pas ajouté, aucun échec bruyant.
    if: ${{ github.repository == 'shakilnubee/ParcPilot' || github.repository == 'shakilnubee/Autoflotte' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer le CLI Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Déployer toutes les Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN absent — ajoute-le dans les secrets GitHub pour activer le déploiement auto. Rien déployé."
            exit 0
          fi
          # Déploie chaque fonction présente dans supabase/functions/ (dossiers avec un index.ts).
          # --project-ref = référence du projet Supabase (dans l'URL du projet, pas un secret).
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            if [ -f "$dir/index.ts" ]; then
              echo "→ Déploiement de $fn"
              supabase functions deploy "$fn" --project-ref tzjuptlzoywjeigmyfuj
            fi
          done

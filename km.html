  }
  function paintForm() {
    if (CUR.chauffeur) $('sub').textContent = t('hello')(String(CUR.chauffeur).split(' ')[0]);
    else $('sub').textContent = t('sub');
    // Suffixe « (relevé le …) » — n'apparaît qu'à partir du 1er relevé daté (les anciens n'ont pas de date).
    var dateSfx = CUR.kmDate ? t('on')(fmtDate(CUR.kmDate)) : '';
    if (CUR.deja && CUR.kmRecu != null) { $('kmknown').innerHTML = t('already')(Number(CUR.kmRecu).toLocaleString(localeNb())); }
    else if (CUR.kmConnu != null) { $('kmknown').innerHTML = t('lastknown')(Number(CUR.kmConnu).toLocaleString(localeNb())) + dateSfx; }
    else { $('kmknown').innerHTML = ''; }
  }

  // Sélecteur de langue
  $('lang-switch').addEventListener('click', function (e) {
    var b = e.target.closest('[data-lang]'); if (!b) return;
    LANG = _okLang(b.getAttribute('data-lang')) || 'fr'; manual = true;
    try { localStorage.setItem('pp_lang', LANG); } catch (err) {}
    applyStaticI18n();
    if (lastState === 'form') paintForm();
  });

  applyStaticI18n();

  if (!token && !qr) { show('bad'); applyStaticI18n(); $('bad-sub').textContent = t('incomplete'); return; }

  // 1) Charger les infos du véhicule — avec un délai max (réseau faible : parking souterrain…) : au lieu
  // d'un spinner infini, on bascule sur l'écran d'erreur (qui invite à réessayer) après ~12 s.
  var _lc = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var _lt = setTimeout(function () { try { _lc && _lc.abort(); } catch (e) {} }, 12000);
  fetch(FN + '?' + keyParam(), { headers: headers(), cache: 'no-store', signal: _lc ? _lc.signal : undefined })
    .then(function (r) { clearTimeout(_lt); return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      var d = res.d || {};
      if (!res.ok || !d.ok) { show('bad'); $('bad-sub').textContent = d.error || t('invalid'); return; }
      // Langue du conducteur (serveur) si l'utilisateur n'a rien choisi manuellement.
      if (!manual && d.langue === 'en') { LANG = 'en'; applyStaticI18n(); }
      if (d.plaque) $('plate-wrap').innerHTML = plateHTML(d.plaque);
      if (d.societe) { $('soc-foot').textContent = d.societe; }
      CUR.chauffeur = d.chauffeur || ''; CUR.kmConnu = d.kmConnu; CUR.deja = !!d.deja; CUR.kmRecu = d.kmRecu; CUR.kmDate = d.kmDate || null;
      if (d.deja && d.kmRecu != null) $('km').value = d.kmRecu;
      show('form'); paintForm();
      setTimeout(function () { $('km').focus(); }, 150);
    })
    .catch(function () {
      clearTimeout(_lt); show('bad'); $('bad-sub').textContent = t('conn');
      var rb = $('bad-retry'); if (rb) { var RM = { fr: 'Réessayer', en: 'Try again', es: 'Reintentar', it: 'Riprova', de: 'Erneut versuchen', zh: '重试' }; rb.textContent = RM[LANG] || RM.fr; rb.classList.remove('hide'); }
    });

  // Traduit un message d'erreur serveur à partir de son CODE (le serveur renvoie `code` + repli FR `error`).
  function kmErrMsg(d) {
    if (!d || !d.code) return '';
    var n = (d.km != null) ? Number(d.km).toLocaleString(localeNb()) : '';
    var r = (d.kmRef != null) ? Number(d.kmRef).toLocaleString(localeNb()) : '';
    var M = {
      km_invalid: { fr: 'Kilométrage invalide. Saisis un nombre (ex. 45 000).', en: 'Invalid mileage. Enter a number (e.g. 45,000).', es: 'Kilometraje no válido. Introduce un número (p. ej. 45 000).', it: 'Chilometraggio non valido. Inserisci un numero (es. 45.000).', de: 'Ungültiger Kilometerstand. Gib eine Zahl ein (z. B. 45.000).', zh: '里程无效。请输入数字（例如 45000）。' },
      km_lower: { fr: 'Le kilométrage saisi (' + n + ') est inférieur au dernier relevé connu (' + r + '). Vérifie ton compteur.', en: 'The mileage entered (' + n + ') is lower than the last known reading (' + r + '). Please check your odometer.', es: 'El kilometraje (' + n + ') es inferior al último registrado (' + r + '). Revisa tu cuentakilómetros.', it: 'Il chilometraggio (' + n + ') è inferiore all\'ultimo noto (' + r + '). Controlla il contachilometri.', de: 'Der Kilometerstand (' + n + ') ist niedriger als der letzte bekannte (' + r + '). Bitte prüfe deinen Tacho.', zh: '输入的里程（' + n + '）低于上次记录（' + r + '）。请检查里程表。' },
      km_save: { fr: 'Échec de l\'enregistrement. Réessaie.', en: 'Saving failed. Please try again.', es: 'Error al guardar. Inténtalo de nuevo.', it: 'Salvataggio non riuscito. Riprova.', de: 'Speichern fehlgeschlagen. Bitte erneut versuchen.', zh: '保存失败，请重试。' }
    };
    var m = M[d.code]; return m ? (m[LANG] || m.fr) : '';
  }
  // 2) Envoyer le km
  function submit() {
    var km = parseInt(($('km').value || '').replace(/[^0-9]/g, ''), 10);
    $('err').style.display = 'none';
    if (!km || km <= 0) { $('err').textContent = t('needkm'); $('err').style.display = 'block'; return; }
    // Garde-fou faute de frappe : saut énorme vs dernier km connu (> +20 000 km OU > ×1,5) → confirmation douce.
    var _known = (CUR.kmConnu != null && !isNaN(Number(CUR.kmConnu))) ? Number(CUR.kmConnu) : null;
    if (_known != null && km > _known && (km - _known > 20000 || km > _known * 1.5)) {
      var _n = km.toLocaleString(localeNb()), _d = (km - _known).toLocaleString(localeNb());
      var _M = {
        fr: 'Tu as saisi ' + _n + ' km, soit +' + _d + ' km depuis le dernier relevé. C\'est bien ça ?',
        en: 'You entered ' + _n + ' km, i.e. +' + _d + ' km since the last reading. Is that correct?',
        es: 'Has introducido ' + _n + ' km, es decir +' + _d + ' km desde la última lectura. ¿Es correcto?',
        it: 'Hai inserito ' + _n + ' km, cioè +' + _d + ' km dall\'ultima lettura. È corretto?',
        de: 'Du hast ' + _n + ' km eingegeben, also +' + _d + ' km seit der letzten Ablesung. Stimmt das?',
        zh: '您输入了 ' + _n + ' 公里，即自上次读数以来 +' + _d + ' 公里。确认吗？'
      };
      if (!window.confirm(_M[LANG] || _M.fr)) return;
    }
    $('send').disabled = true; $('send').innerHTML = '<span class="spin" style="width:18px;height:18px;border-width:2px;vertical-align:-3px"></span> ' + esc(t('sending'));
    var _body = keyBody(); _body.km = km;
    fetch(FN, { method: 'POST', headers: headers(), body: JSON.stringify(_body) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        var d = res.d || {};
        if (!res.ok || !d.ok) {
          $('send').disabled = false; $('send').textContent = t('send');
          $('err').textContent = kmErrMsg(d) || d.error || t('sendfail'); $('err').style.display = 'block'; return;
        }
        $('done-sub').innerHTML = t('saved')(Number(d.km).toLocaleString(localeNb()));
        show('done');
      })
      .catch(function () {
        $('send').disabled = false; $('send').textContent = t('send');
        $('err').textContent = t('conn2'); $('err').style.display = 'block';
      });
  }
  $('send').addEventListener('click', submit);
  $('km').addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
})();
</script>
</body>
</html>
